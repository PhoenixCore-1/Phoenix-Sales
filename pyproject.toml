[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-sales"
version = "1.0.0"
description = "Phoenix Sales V1.0 business module"
requires-python = ">=3.11"
dependencies = [
    "phoenix-core-v2 @ git+https://github.com/PhoenixCore-1/Phoenix_V2.0.git",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
